services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duriancare}
      POSTGRES_USER: ${POSTGRES_USER:-duriancare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duriancare} -d ${POSTGRES_DB:-duriancare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duriancare}
      POSTGRES_USER: ${POSTGRES_USER:-duriancare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duriancare}
      POSTGRES_USER: ${POSTGRES_USER:-duriancare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duriancare}
      POSTGRES_USER: ${POSTGRES_USER:-duriancare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      - backend

volumes:
  pgdata:
